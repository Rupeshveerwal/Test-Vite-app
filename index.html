<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .logo {
            font-size: 3em;
            font-weight: bold;
            position: relative;
            opacity: 0;
            animation: logoMove 2s ease-in-out forwards;
        }

        @keyframes logoMove {
            0% {
                opacity: 0;
                transform: translateY(-100px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .buttons {
            margin-top: 20px;
            display: none;
        }

        .buttons button {
            padding: 10px 20px;
            font-size: 1.2em;
            margin: 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .buttons button:hover {
            background-color: #0056b3;
        }

        /* Show buttons after logo animation */
        .show-buttons .buttons {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Welcome to RentEase</div>
        <div class="buttons">
            <p>Are you an Owner or Tenant?</p>
            <button id="ownerBtn">Owner</button>
            <button id="tenantBtn">Tenant</button>
        </div>
    </div>

    <script>
        // Show the buttons after the logo animation ends
        setTimeout(() => {
            document.querySelector('.container').classList.add('show-buttons');
        }, 2000);

        document.getElementById('ownerBtn').addEventListener('click', () => {
            alert("You selected Owner!");
        });

        document.getElementById('tenantBtn').addEventListener('click', () => {
            alert("You selected Tenant!");
        });
    </script>
</body>
</html>
